services:
  lemmajevgaun:
    build: .
    image: lemmajevgaun:local
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY}
      # Builder IDs, not caller-provided shell commands. artifact-echo re-emits
      # the packet artifact unchanged, so a rework cycle ends builder_noop ->
      # final "rework" instead of an MCP error; artifact-revise repairs the
      # evidence dimension deterministically (see skills/lemmajevgaun/SKILL.md).
      LEMMALOG_GAUNTLET_BUILDERS_JSON: '{"artifact-echo":"/bin/sh /data/gauntlet-scripts/gauntlet-builder-echo.sh","artifact-revise":"/usr/local/bin/lemmajevgaun-revise"}'
      LEMMALOG_MCP_PATH: /data/lemmalog-memory.snapshot
      # 1 (por defecto) escribe pregunta y respuesta de cada llamada en el log
      # de eventos: es el registro que se usa para auditar qué vio el modelo.
      # Ponlo a 0 si el log se va a compartir: los cuerpos llevan datos personales.
      LEMMALOG_MCP_LOG_BODIES: ${LEMMALOG_MCP_LOG_BODIES:-1}
      # Log de eventos persistente, en el volumen del host: sobrevive a un
      # recreate del contenedor, que `docker logs` no.
      LEMMALOG_MCP_EVENTS: /data/eventos.jsonl
    # El puerto se publica al instante, pero el servidor no acepta hasta haber
    # cargado el snapshot: medido ~40 s con lemmalog-memory.snapshot de 8,8 MB.
    # Sin esto, docker informa "sano" desde el segundo uno y un cliente MCP que
    # arranque a la vez ve el servidor caido y desiste.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8765"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    mem_limit: 14g
    memswap_limit: 14g
    restart: unless-stopped
    # Store del host: sobrevive a resets de la VM de Docker Desktop.
    # user 501 (pere) para poder escribir el snapshot con permisos del host.
    user: "501:20"
    volumes:
      - /Users/pere/.lemmalog:/data
      - ./scripts:/data/gauntlet-scripts:ro
